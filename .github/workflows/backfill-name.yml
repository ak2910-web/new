name: Backfill Name Art

on:
  workflow_dispatch:  # run manually from the Actions tab, once

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Git configuration
        run: |
          git config --global user.name "ak2910-web"
          git config --global user.email "ak2910-web@users.noreply.github.com"

      - name: Run backfill script
        run: python3 scripts/backfill-name.py

      - name: Push backdated commits
        run: git push
